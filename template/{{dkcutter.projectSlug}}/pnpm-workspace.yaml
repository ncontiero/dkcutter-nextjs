allowBuilds:
{%- if dkcutter.useTriggerDev %}
  "@depot/cli": true
{%- endif %}
{%- if dkcutter.i18n == "nextIntl" %}
  "@parcel/watcher": false
{%- endif %}
{%- if dkcutter.usePrisma %}
  "@prisma/engines": true
{%- endif %}
{%- if dkcutter.i18n == "nextIntl" %}
  "@swc/core": false
{%- endif %}
{%- if dkcutter.useTriggerDev %}
  esbuild: true
{%- endif %}
{%- if dkcutter.usePrisma %}
  prisma: true
{%- endif %}
  unrs-resolver: true

minimumReleaseAge: 4320
